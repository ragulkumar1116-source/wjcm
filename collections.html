<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections – Church Youth Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase/firebase-config.js"></script>
<script src="js/1sync.js"></script>
<script src="js/1app.js"></script>
<script src="js/1layout.js"></script>
<script>
App.requireAuth(({ churchId, role }) => {
  renderLayout('Collections');

  const cid = churchId;
  const body = document.getElementById('page-body');

  body.innerHTML = `
    <div class="toolbar no-print">
      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input type="text" id="search" class="form-control" placeholder="Search member name…" oninput="filterColls()">
      </div>
      <select id="filter-month" class="form-control" style="width:auto" onchange="filterColls()">
        <option value="">All Months</option>
        ${App.MONTHS.map(m => `<option value="${m}" ${m === App.currentMonthName() ? 'selected' : ''}>${m}</option>`).join('')}
      </select>
      <select id="filter-year" class="form-control" style="width:auto" onchange="filterColls()">
        ${[App.currentYear(), App.currentYear()-1, App.currentYear()-2].map(y => `<option value="${y}">${y}</option>`).join('')}
      </select>
      ${role === 'admin' || role === 'collector' ? `<button class="btn btn-gold" onclick="openAddModal()">➕ Add Collection</button>` : ''}
    </div>

    <!-- Summary cards -->
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:1rem">
      <div class="stat-card">
        <div class="stat-icon green">✅</div>
        <div class="stat-info"><div class="label">Collected</div><div class="value" id="sum-collected">–</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon gold">🧾</div>
        <div class="stat-info"><div class="label">Entries</div><div class="value" id="sum-count">–</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue">📅</div>
        <div class="stat-info"><div class="label">Period</div><div class="value" id="sum-period" style="font-size:1rem">–</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Collection Records</h3>
        <button class="btn btn-outline btn-sm no-print" onclick="window.print()">🖨 Print</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>#</th><th>Member</th><th>Month</th><th>Year</th><th>Amount</th><th>Date</th><th>Remarks</th><th class="no-print">Actions</th></tr>
          </thead>
          <tbody id="colls-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Add Collection Modal -->
    <div class="modal-overlay" id="add-modal">
      <div class="modal">
        <div class="modal-header">
          <h3 id="add-modal-title">Add Collection</h3>
          <button class="btn btn-outline btn-sm" onclick="closeAdd()">✕</button>
        </div>
        <div class="modal-body">
          <div id="add-alert" class="alert alert-danger"></div>
          <input type="hidden" id="edit-coll-id">
          <div class="form-group">
            <label>Member *</label>
            <select id="c-member" class="form-control">
              <option value="">– Select Member –</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Month *</label>
              <select id="c-month" class="form-control">
                ${App.MONTHS.map(m => `<option value="${m}" ${m===App.currentMonthName()?'selected':''}>${m}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Year</label>
              <input id="c-year" type="number" class="form-control" value="${App.currentYear()}">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Amount (${App.getCurrency()}) *</label>
              <input id="c-amount" type="number" class="form-control" placeholder="0" min="1">
            </div>
            <div class="form-group">
              <label>Date</label>
              <input id="c-date" type="date" class="form-control" value="${new Date().toISOString().split('T')[0]}">
            </div>
          </div>
          <div class="form-group">
            <label>Remarks</label>
            <input id="c-remarks" type="text" class="form-control" placeholder="e.g. Full payment">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeAdd()">Cancel</button>
          <button class="btn btn-gold" onclick="saveCollection()">💾 Save</button>
        </div>
      </div>
    </div>

    <!-- Delete confirm -->
    <div class="modal-overlay" id="del-modal">
      <div class="modal" style="max-width:380px">
        <div class="modal-header"><h3>Delete Collection</h3></div>
        <div class="modal-body"><p>Delete this collection entry? This cannot be undone.</p></div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="document.getElementById('del-modal').classList.remove('open')">Cancel</button>
          <button class="btn btn-danger" onclick="confirmDelColl()">🗑 Delete</button>
        </div>
      </div>
    </div>
  `;

  let allMembers = {}, allColls = {}, deleteTarget = null;

  // Live listeners
  db.ref(`churches/${cid}/members`).on('value', snap => {
    allMembers = snap.val() || {};
    SyncEngine.cacheWrite('members_' + cid, allMembers);
    populateMemberSelect();
    filterColls();
  });
  db.ref(`churches/${cid}/collections`).on('value', snap => {
    allColls = snap.val() || {};
    SyncEngine.cacheWrite('collections_' + cid, allColls);
    filterColls();
  });

  if (!navigator.onLine) {
    allMembers = SyncEngine.readCache('members_' + cid) || {};
    allColls   = SyncEngine.readCache('collections_' + cid) || {};
    populateMemberSelect();
    filterColls();
  }

  function populateMemberSelect() {
    const sel = document.getElementById('c-member');
    const cur = sel.value;
    const opts = Object.entries(allMembers)
      .filter(([, m]) => m.status === 'active')
      .sort((a, b) => a[1].name?.localeCompare(b[1].name))
      .map(([id, m]) => `<option value="${id}">${m.name} (${m.area || 'No Area'})</option>`)
      .join('');
    sel.innerHTML = '<option value="">– Select Member –</option>' + opts;
    if (cur) sel.value = cur;
  }

  window.filterColls = function() {
    const q     = (document.getElementById('search').value || '').toLowerCase();
    const month = document.getElementById('filter-month').value;
    const year  = document.getElementById('filter-year').value;

    document.getElementById('sum-period').textContent = (month || 'All') + ' ' + year;

    const filtered = Object.entries(allColls).filter(([, c]) => {
      const mn = allMembers[c.memberId];
      const matchQ = !q || (mn?.name || c.memberName || '').toLowerCase().includes(q);
      const matchM = !month || c.month === month;
      const matchY = !year  || String(c.year || App.currentYear()) === year;
      return matchQ && matchM && matchY;
    }).sort((a, b) => (b[1].date || '').localeCompare(a[1].date || ''));

    const total = filtered.reduce((s, [, c]) => s + Number(c.amount || 0), 0);
    document.getElementById('sum-collected').textContent = App.currency(total);
    document.getElementById('sum-count').textContent     = filtered.length;

    const tbody = document.getElementById('colls-body');
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="ico">💰</div><p>No collections found</p></div></td></tr>`;
      return;
    }

    const canEdit = role === 'admin' || role === 'collector';
    tbody.innerHTML = filtered.map(([id, c], i) => {
      const m = allMembers[c.memberId];
      const name = m?.name || c.memberName || '–';
      const init = name.slice(0,2).toUpperCase();
      return `
        <tr>
          <td style="color:var(--muted);font-size:.8rem">${i+1}</td>
          <td>
            <div style="display:flex;align-items:center;gap:.6rem">
              <div class="member-avatar" style="width:30px;height:30px;font-size:.7rem">${init}</div>
              <a href="member-profile.html?id=${c.memberId}" style="font-weight:600;color:var(--navy);text-decoration:none">${name}</a>
            </div>
          </td>
          <td>${c.month}</td>
          <td>${c.year || App.currentYear()}</td>
          <td style="font-weight:700;color:var(--green)">${App.currency(c.amount)}</td>
          <td style="font-size:.82rem">${c.date || '–'}</td>
          <td style="font-size:.82rem;color:var(--muted)">${c.remarks || ''}</td>
          <td class="no-print">
            <div style="display:flex;gap:.4rem">
              ${canEdit ? `<button class="btn btn-outline btn-sm" onclick="editColl('${id}')">✏️</button>` : ''}
              ${role === 'admin' ? `<button class="btn btn-danger btn-sm" onclick="delColl('${id}')">🗑</button>` : ''}
            </div>
          </td>
        </tr>
      `;
    }).join('');
  };

  window.openAddModal = function() {
    document.getElementById('add-alert').classList.remove('show');
    document.getElementById('edit-coll-id').value = '';
    document.getElementById('c-member').value  = '';
    document.getElementById('c-amount').value  = '';
    document.getElementById('c-remarks').value = '';
    document.getElementById('c-month').value   = App.currentMonthName();
    document.getElementById('c-year').value    = App.currentYear();
    document.getElementById('c-date').value    = new Date().toISOString().split('T')[0];
    document.getElementById('add-modal-title').textContent = 'Add Collection';
    document.getElementById('add-modal').classList.add('open');
  };

  window.editColl = function(id) {
    const c = allColls[id];
    if (!c) return;
    document.getElementById('add-alert').classList.remove('show');
    document.getElementById('edit-coll-id').value = id;
    document.getElementById('c-member').value  = c.memberId || '';
    document.getElementById('c-month').value   = c.month;
    document.getElementById('c-year').value    = c.year || App.currentYear();
    document.getElementById('c-amount').value  = c.amount;
    document.getElementById('c-date').value    = c.date || '';
    document.getElementById('c-remarks').value = c.remarks || '';
    document.getElementById('add-modal-title').textContent = 'Edit Collection';
    document.getElementById('add-modal').classList.add('open');
  };

  window.closeAdd = function() {
    document.getElementById('add-modal').classList.remove('open');
  };

  window.saveCollection = async function() {
    const memberId = document.getElementById('c-member').value;
    const month    = document.getElementById('c-month').value;
    const year     = Number(document.getElementById('c-year').value);
    const amount   = Number(document.getElementById('c-amount').value);
    const date     = document.getElementById('c-date').value;
    const remarks  = document.getElementById('c-remarks').value.trim();

    if (!memberId || !amount || amount <= 0) {
      const al = document.getElementById('add-alert');
      al.textContent = 'Please select a member and enter a valid amount.';
      al.classList.add('show');
      return;
    }

    const editId = document.getElementById('edit-coll-id').value;
    const id     = editId || App.newId('COL');
    const memberName = allMembers[memberId]?.name || '';
    const data = { memberId, memberName, month, year, amount, date, remarks, updatedAt: Date.now() };
    if (!editId) data.createdAt = Date.now();

    await SyncEngine.write(`churches/${cid}/collections/${id}`, data, editId ? 'update' : 'set');
    allColls[id] = { ...(allColls[id] || {}), ...data };
    SyncEngine.cacheWrite('collections_' + cid, allColls);
    filterColls();
    closeAdd();
  };

  window.delColl = function(id) {
    deleteTarget = id;
    document.getElementById('del-modal').classList.add('open');
  };

  window.confirmDelColl = async function() {
    if (!deleteTarget) return;
    await SyncEngine.write(`churches/${cid}/collections/${deleteTarget}`, null, 'remove');
    delete allColls[deleteTarget];
    SyncEngine.cacheWrite('collections_' + cid, allColls);
    filterColls();
    document.getElementById('del-modal').classList.remove('open');
    deleteTarget = null;
  };
});
</script>
</body>
</html>
